

<img id="logo" width="1024" height="1024" class="header-logo" src="/images/logo.webp" alt="Digiguru" fetchpriority="high" decoding="async" />


<style>
.header-logo {
    display: block;
    width: 650px;
    height: auto;
    aspect-ratio: 1 / 1;
    max-width: 100%;
    transition: width 0.5s, height 0.5s;
}  
.header-logo.header-shrink {
    height: 120px;
    width: 120px;
}
</style>
<script>
    // When the user scrolls down 50px from the top of the document, resize the header logo.
window.onscroll = function() {scrollFunction()};

function scrollFunction() {
  if (document.body.scrollTop > 50 || document.documentElement.scrollTop > 50) {
    document.getElementById("logo").classList.add("header-shrink");
  } else {
    document.getElementById("logo").classList.remove("header-shrink");
  }
}
</script>
