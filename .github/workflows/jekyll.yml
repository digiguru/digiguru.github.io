# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]

  # Rebuild periodically so changes merged into digiguru/presentation are
  # picked up automatically without any runtime API dependency or PAT.
  schedule:
    - cron: "17 * * * *"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Checkout presentations
        uses: actions/checkout@v4
        with:
          repository: digiguru/presentation
          ref: master
          path: presentation-source

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate presentation metadata
        run: node presentation-source/scripts/presentations.mjs --check --manifest _data/presentations.yml

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          cache-version: 0

      - name: Setup Github Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Export presentations into Pages artifact
        run: node presentation-source/scripts/presentations.mjs --export _site/presentation

      - name: Verify generated presentation links
        run: |
          ruby -ryaml -e '
            presentations = YAML.load_file("_data/presentations.yml")
            missing = presentations.reject { |p| File.exist?(File.join("_site", "presentation", p.fetch("url"))) }
            abort("Missing generated presentations: #{missing.map { |p| p["url"] }.join(", ")}") unless missing.empty?
            puts "Verified #{presentations.length} generated presentation links"
          '

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
