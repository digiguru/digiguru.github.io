name: Jekyll CI and Pages deploy

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      presentation_sha:
        description: "Exact presentation commit SHA to deploy (leave blank for main)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v7

      - name: Checkout presentations
        uses: actions/checkout@v7
        with:
          repository: digiguru/presentation
          ref: ${{ inputs.presentation_sha || 'main' }}
          path: presentation-source

      - name: Capture release metadata
        shell: bash
        env:
          REQUESTED_PRESENTATION_SHA: ${{ inputs.presentation_sha }}
        run: |
          WEBSITE_SHA="$(git rev-parse HEAD)"
          PRESENTATION_SHA="$(git -C presentation-source rev-parse HEAD)"
          BUILT_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          if [[ -n "$REQUESTED_PRESENTATION_SHA" ]]; then
            if [[ ! "$REQUESTED_PRESENTATION_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "presentation_sha must be a full 40-character lowercase commit SHA" >&2
              exit 1
            fi
            if [[ "$PRESENTATION_SHA" != "$REQUESTED_PRESENTATION_SHA" ]]; then
              echo "Presentation checkout mismatch: requested $REQUESTED_PRESENTATION_SHA but checked out $PRESENTATION_SHA" >&2
              exit 1
            fi
          fi

          {
            printf 'website_sha: "%s"\n' "$WEBSITE_SHA"
            printf 'presentation_sha: "%s"\n' "$PRESENTATION_SHA"
            printf 'built_at: "%s"\n' "$BUILT_AT"
            printf 'workflow_run_id: "%s"\n' "$GITHUB_RUN_ID"
            printf 'workflow_run_attempt: "%s"\n' "$GITHUB_RUN_ATTEMPT"
          } > _data/release.yml

          echo "Release website=$WEBSITE_SHA presentations=$PRESENTATION_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check Node script syntax
        run: |
          for file in scripts/*.mjs; do
            node --check "$file"
          done

      - name: Test Node build scripts
        run: node --test test/build_scripts.test.mjs

      - name: Generate presentation metadata
        run: node presentation-source/scripts/presentations.mjs --check --manifest _data/presentations.yml

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Check Ruby plugin syntax and warnings
        run: |
          for file in _plugins/*.rb; do
            ruby -cw "$file"
          done

      - name: Validate GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="/tmp/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory /tmp actionlint
          /tmp/actionlint

      - name: Validate site data
        run: ruby scripts/validate-site-data.rb

      - name: Audit Ruby dependencies
        run: bundle exec bundle-audit check --update

      - name: Test Ruby plugins
        run: bundle exec ruby test/ruby_plugins_test.rb

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Export presentations into Pages artifact
        run: node presentation-source/scripts/presentations.mjs --export _site/presentation

      - name: Stamp release metadata into presentations
        run: node scripts/stamp-release.mjs _site/presentation _site/release.json

      - name: Verify generated presentation links
        run: |
          ruby -ryaml -e '
            presentations = YAML.load_file("_data/presentations.yml")
            missing = presentations.reject { |p| File.exist?(File.join("_site", "presentation", p.fetch("url"))) }
            abort("Missing generated presentations: #{missing.map { |p| p["url"] }.join(", ")}") unless missing.empty?
            puts "Verified #{presentations.length} generated presentation links"
          '

      - name: Validate exported presentation assets
        run: node scripts/check-exported-presentation-assets.mjs _site _site/presentation

      - name: Verify release metadata
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';

          const release = JSON.parse(await readFile('_site/release.json', 'utf8'));
          const websiteSha = release.website?.sha;
          const presentationSha = release.presentations?.sha;
          const shaPattern = /^[0-9a-f]{40}$/;

          if (!shaPattern.test(websiteSha) || !shaPattern.test(presentationSha)) {
            throw new Error('release.json does not contain valid full commit SHAs');
          }

          const home = await readFile('_site/index.html', 'utf8');
          const expectedFlag = `w:${websiteSha.slice(0, 7)} p:${presentationSha.slice(0, 7)}`;
          if (!home.includes(websiteSha) || !home.includes(presentationSha) || !home.includes(expectedFlag)) {
            throw new Error('Homepage does not expose the deployed release metadata');
          }

          console.log(`Verified release ${expectedFlag}`);
          NODE

      - name: Validate generated site
        run: |
          set -o pipefail
          bundle exec htmlproofer ./_site \
            --disable-external \
            --no-enforce-https \
            --ignore-files '/\/presentation\//' \
            --checks Links,Images,Scripts 2>&1 | tee htmlproofer.log

      - name: Upload HTMLProofer failure log
        if: ${{ failure() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: htmlproofer-log
          path: htmlproofer.log
          retention-days: 1

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5

  deploy:
    if: github.event_name != 'pull_request'
    needs: build-and-validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  smoke-test:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout website
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Smoke test deployed site
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/smoke-deployed-site.mjs "$SITE_URL" "$GITHUB_SHA"
