name: Dependabot Auto-Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'digiguru/digiguru.github.io'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ github.token }}"

      - name: Leave GitHub Actions updates for manual review
        if: steps.metadata.outputs.package-ecosystem == 'github-actions'
        run: echo "GitHub Actions dependency updates are intentionally excluded from auto-merge."

      - name: Approve an ordinary dependency PR
        if: steps.metadata.outputs.package-ecosystem != 'github-actions'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}

      - name: Enable auto-merge for ordinary dependency PRs
        if: steps.metadata.outputs.package-ecosystem != 'github-actions'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
