name: Refresh Gemfile lock

on:
  push:
    branches:
      - agent/improve-pages-ci-cd

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/improve-pages-ci-cd
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Refresh lockfile
        run: bundle install
      - name: Validate
        run: |
          bundle exec bundle-audit check --update
          JEKYLL_ENV=production bundle exec jekyll build
          bundle exec htmlproofer ./_site --disable-external --checks Links,Images,Scripts
      - name: Commit lockfile
        run: |
          if git diff --quiet -- Gemfile.lock; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Gemfile.lock
          git commit -m "Refresh Gemfile lock"
          git push
