name: Stage 5 Pure integration

on:
  push:
    branches: [agent/stage5-pure-presentations]

permissions:
  contents: read

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout website
        uses: actions/checkout@v7

      - name: Checkout staged Pure presentations
        uses: actions/checkout@v7
        with:
          repository: digiguru/presentation
          ref: agent/stage5-pages-integration
          path: presentation-source

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test website build scripts
        run: node --test test/build_scripts.test.mjs

      - name: Generate and export staged presentations
        run: |
          mkdir -p /tmp/stage5-site/_data
          node presentation-source/scripts/presentations.mjs \
            --check \
            --manifest /tmp/stage5-site/_data/presentations.yml \
            --export /tmp/stage5-site/presentation

      - name: Create staged release metadata
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';

          const websiteSha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const presentationSha = execFileSync('git', ['-C', 'presentation-source', 'rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          await writeFile('/tmp/stage5-site/release.json', JSON.stringify({
            website: { sha: websiteSha },
            presentations: { sha: presentationSha },
            built_at: new Date().toISOString(),
          }));
          NODE

      - name: Stamp production presentation configuration
        run: node scripts/stamp-release.mjs /tmp/stage5-site/presentation /tmp/stage5-site/release.json

      - name: Validate staged presentation assets
        run: node scripts/check-exported-presentation-assets.mjs /tmp/stage5-site /tmp/stage5-site/presentation

      - name: Verify Pure production contract
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';

          const manifest = JSON.parse(await readFile('/tmp/stage5-site/presentation/presentations.json', 'utf8'));
          if (manifest.length !== 25) throw new Error(`Expected 25 presentations, found ${manifest.length}`);

          const index = await readFile('/tmp/stage5-site/presentation/index.html', 'utf8');
          if (!index.includes('name="pure-gpt-api-base" content="https://ai-prompt-writer.vercel.app/api"')) {
            throw new Error('Pages artifact does not stamp the direct production GPT API base');
          }

          for (const presentation of manifest) {
            const html = await readFile(`/tmp/stage5-site/presentation/${presentation.url}`, 'utf8');
            if (!html.includes('name="pure-gpt-api-base" content="https://ai-prompt-writer.vercel.app/api"')) {
              throw new Error(`${presentation.url} is missing the direct production GPT API base`);
            }
            if (!html.includes('data-pure-source=')) {
              throw new Error(`${presentation.url} is not a Pure presentation artifact`);
            }
          }

          console.log(`Verified ${manifest.length} Pure Pages presentations with direct production GPT API configuration.`);
          NODE
